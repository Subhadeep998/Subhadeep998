name: Profile live section

on:
  schedule:
    # Two runs a day, away from GitHub's busy midnight-UTC hour: if one is delayed
    # or dropped, the other catches up. Re-running is harmless.
    - cron: "13 2 * * *"    # 07:43 IST
    - cron: "43 5 * * *"    # 11:13 IST backup
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-live.yml"]   # run once whenever this schedule file changes

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Refresh live section
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/live.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: refresh live section"
          git push
